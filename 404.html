<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | CANTATA Studio</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --carbon-black: #18181B;
            --deep-black: #000000;
            --graphite: #27272A;
            --ivory: #FAFAFA;
            --champagne-gold: #C9A87C;
        }
        body {
            font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
            background: var(--deep-black);
            color: var(--ivory);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .container {
            max-width: 480px;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            letter-spacing: 0.12em;
            color: rgba(250, 250, 250, 0.3);
            margin-bottom: 60px;
        }
        .logo span { color: rgba(250, 250, 250, 0.5); }
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: clamp(80px, 16vw, 140px);
            font-weight: 700;
            color: var(--ivory);
            line-height: 1;
            margin-bottom: 24px;
        }
        .message {
            font-size: 16px;
            color: rgba(250, 250, 250, 0.6);
            line-height: 1.8;
            margin-bottom: 48px;
        }
        .home-link {
            display: inline-block;
            padding: 16px 48px;
            border: 1px solid var(--champagne-gold);
            color: var(--champagne-gold);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-decoration: none;
            transition: all 0.3s;
        }
        .home-link:hover {
            background: var(--champagne-gold);
            color: var(--deep-black);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">CANTATA<span>STUDIO</span></div>
        <div class="error-code">404</div>
        <p class="message">抱歉，您访问的页面不存在。<br>也许它已经过期，或者您输入了错误的地址。</p>
        <a href="/" class="home-link">返回首页</a>
    </div>
</body>
</html>
